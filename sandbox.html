<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guard the Gate — ECS Sandbox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #game {
      position: relative;
      width: 600px;
      height: 800px;
      background: #1a1a2e;
      overflow: hidden;
      border: 1px solid #333;
      cursor: crosshair;
    }
    #score {
      position: absolute;
      top: 8px;
      right: 12px;
      color: #fff;
      font: 16px monospace;
      z-index: 10;
      pointer-events: none;
    }
    #gate {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      height: 4px;
      background: #e74c3c;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="score">Score: 0</div>
    <div id="gate"></div>
  </div>
  <script type="module" src="/src/sandbox/guard-the-gate/main.ts"></script>
</body>
</html>
